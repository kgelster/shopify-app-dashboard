# Fly.io configuration. Nothing in the application is Fly-specific, but two
# constraints here are real wherever you deploy: exactly one instance, and
# migrations on release.
#
# Rename `app` to something you own, or deploy with `fly deploy -a <your-app>`,
# which overrides it.

app = 'shopify-partner-dashboard'
primary_region = 'ord'

[build]

[env]
  # How often the scheduler polls the Partner API. Non-secret, so it lives here
  # rather than in secrets. The ops-strip red threshold and the stale-sync Slack
  # alert are both multiples of this (3 and 4 polls), so raising it moves them
  # with it. 30 suits an app whose numbers change daily at most.
  POLL_INTERVAL_MINUTES = "30"

[deploy]
  release_command = 'python -m partner_dashboard.migrate'

[http_service]
  internal_port = 8080
  force_https = true
  # One instance, always. Two means two APScheduler instances, so duplicate
  # polls and duplicate Slack alerts. Do not scale this out.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
